[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff — pragmatic linting that catches real bugs (pyflakes/bugbear/pyupgrade)
# without forcing a mass reformat. Style-only rules that fight this codebase's
# conventions are ignored on purpose; they can be tightened later.
[tool.ruff]
target-version = "py312"
line-length = 120
# Alembic migrations are boilerplate (op/sa imported-but-sometimes-unused) — not linted.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = [
    "E501",  # line-too-long — this codebase intentionally uses long lines
    "E741",  # ambiguous variable name (l/I/O) — stylistic
    "B027",  # empty method in ABC without @abstractmethod — intentional no-op defaults
]
