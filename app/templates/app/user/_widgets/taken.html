{# Doorstroom van taken: wat staat open, wat is er in de periode afgewerkt. #}
<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px;">
  <div><div style="font-size:24px; font-weight:800;">{{ w.data.open }}</div><div style="font-size:12px; color:var(--muted);">{{ _('open') }}</div></div>
  <div><div style="font-size:24px; font-weight:800; color:var(--success-text);">{{ w.data.done }}</div><div style="font-size:12px; color:var(--muted);">{{ _('afgewerkt in periode') }}</div></div>
  <div><div style="font-size:24px; font-weight:800; {% if w.data.overdue %}color:var(--danger);{% endif %}">{{ w.data.overdue }}</div><div style="font-size:12px; color:var(--muted);">{{ _('te laat') }}</div></div>
</div>
<a href="{{ url_for('web.tasks') }}" style="display:inline-block; margin-top:12px; font-size:12px; font-weight:700; color:var(--accent);">{{ _('Naar taken') }} →</a>
